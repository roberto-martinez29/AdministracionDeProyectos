<div class="equipos-page">
    <div class="container py-4">
        <h1 class="page-title mb-4">Lista de Participantes</h1>

        <div class="card equipos-card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0 card-title">Lista de Participantes del Equipo</h5>
                <small class="text-muted">{{ alumnos.length }} alumnos</small>
            </div>

            <div class="card-body p-0">
                <ul class="list-group list-group-flush">
                    <li *ngFor="let alumno of alumnos"
                        class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <div class="equipo-nombre">{{ alumno.nombre }}</div>
                            <div class="equipo-meta text-muted">{{ alumno.matricula }}
                            </div>
                        </div>
                    </li>
                </ul>

                <div class="card-body border-top acciones-row">
                    <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                        <div class="ms-auto">
                            <button class="btn btn-outline-light btn-atras" (click)="atras()">
                                Atrás
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
