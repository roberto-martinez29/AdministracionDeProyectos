<div class="equipos-page">
    <div class="container py-4">
        <h1 class="page-title mb-4">Registro de Equipos Deportivos</h1>

        <div class="card equipos-card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0 card-title">Lista de Equipos</h5>
                <small class="text-muted">{{ equipos.length }} equipos</small>
            </div>

            <div class="card-body p-0">
                <ul class="list-group list-group-flush">
                    <li *ngFor="let equipo of equipos"
                        class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <div class="equipo-nombre">{{ equipo.nombre_equipo }}</div>
                            <div class="equipo-meta text-muted">{{ equipo.deporte }} • {{ equipo.categoria }} • {{
                                equipo.entrenador }}
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn-danger btn-sm btn-outline-light"
                                (click)="listarParticipantes(equipo)">Ver
                                Participantes</button>
                            <button class="btn-outline-danger btn-sm btn-outline-light"
                                (click)="registrar(equipo.id)">Registrarse</button>
                        </div>
                    </li>
                </ul>
                <div class="card-body formulario-registro">
                    <form class="row g-3 align-items-end">
                        <div class="col-12 col-sm-6">
                            <label for="matricula" class="form-label">Matrícula</label>
                            <input id="matricula" name="matricula" class="form-control input-oscuro" type="text"
                                placeholder="Ingrese matrícula" [(ngModel)]="matricula" />
                        </div>

                        <div class="col-12 col-sm-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" name="nombre" class="form-control input-oscuro" type="text"
                                placeholder="Ingrese nombre" [(ngModel)]="nombre" />
                        </div>
                    </form>
                </div>

                <div class="card-body border-top acciones-row">
                    <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                        <div class="ms-auto">
                            <button class="btn btn-outline-light btn-atras" (click)="atras()">
                                Atrás
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
